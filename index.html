<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines 1 Win - 3D Дизайн</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            /* Фон страницы как в оригинале */
            background-color: #0d121d; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            color: #ffffff;
            /* Легкое свечение для заголовка */
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        /* Основная сетка */
        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px; /* Отступы между кнопками */
            margin: 0 auto;
            max-width: 400px;
            width: 100%;
        }

        /* --- НОВЫЙ 3D ДИЗАЙН КЛЕТОЧЕК --- */
        .cell {
            aspect-ratio: 1; /* Квадратные */
            /* Основной цвет - темно-бирюзовый градиент */
            background: linear-gradient(135deg, #177a94 0%, #115c70 100%);
            border-radius: 10px; /* Закругленные углы */
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            
            /* Сложные тени для создания 3D объема и металлического ободка */
            box-shadow: 
                /* Металлический ободок снаружи */
                0 0 0 1.5px #1c2638,
                /* Тень под ободком для глубины */
                0 4px 6px rgba(0, 0, 0, 0.4),
                /* Светлый блик внутри сверху для глянца */
                inset 0 2px 4px rgba(255, 255, 255, 0.15),
                /* Темная тень внутри снизу для объема */
                inset 0 -2px 6px rgba(0, 0, 0, 0.3);
        }

        /* Глянцевый отблеск (светлое пятно в центре) */
        .cell::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Эффект при наведении */
        .cell:hover {
            transform: translateY(-2px); /* Легкое всплытие */
            background: linear-gradient(135deg, #1c91af 0%, #15738c 100%); /* Чуть светлее */
            box-shadow: 
                0 0 0 1.5px #1c2638,
                0 6px 12px rgba(0, 0, 0, 0.5), /* Тень больше */
                inset 0 2px 4px rgba(255, 255, 255, 0.2),
                inset 0 -2px 6px rgba(0, 0, 0, 0.3);
        }

        /* Эффект при нажатии */
        .cell:active {
            transform: translateY(1px); /* Вдавливание */
            box-shadow: 
                0 0 0 1.5px #1c2638,
                0 2px 4px rgba(0, 0, 0, 0.3), /* Тень меньше */
                inset 0 1px 2px rgba(0, 0, 0, 0.2); /* Внутренняя тень сильнее */
        }
        /* --- КОНЕЦ НОВОГО ДИЗАЙНА --- */

        /* Состояние открытой клетки */
        .cell.revealed {
            background: #111827; /* Темный фон */
            cursor: default;
            box-shadow: 
                0 0 0 1.5px #1c2638,
                inset 0 2px 8px rgba(0, 0, 0, 0.6); /* Глубокая внутренняя тень */
        }

        .cell.revealed:hover {
            transform: none;
            background: #111827;
        }

        /* Стили для звезды */
        .cell span {
            font-size: 32px;
            /* Желто-оранжевый цвет для звезды */
            color: #fbbf24;
            /* Свечение звезды */
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ИСПЫТАЙ СВОЮ УДАЧУ В MINES 1 WIN</h1>
        </header>

        <div class="game-board" id="board">
            </div>
    </div>

    <script>
        // ЛОГИКА ИГРЫ (ОСТАЛАСЬ ПРЕЖНЕЙ)
        const board = document.getElementById('board');
        const totalCells = 25;

        for (let i = 0; i < totalCells; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            
            cell.addEventListener('click', function() {
                if (cell.classList.contains('revealed')) return;
                
                cell.classList.add('revealed');
                
                const starSpan = document.createElement('span');
                starSpan.innerHTML = '⭐';
                cell.appendChild(starSpan);
            });
            
            board.appendChild(cell);
        }
    </script>
</body>
</html>
