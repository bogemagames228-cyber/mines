<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Mines</title>
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

<div class="top">
    <div class="balance">💰 <span id="balance">5000</span> ₽</div>
</div>

<div class="grid" id="grid"></div>

<div class="panel">

    <div>
        Мины:
        <button onclick="changeMines(-1)">-</button>
        <span id="mineCount">3</span>
        <button onclick="changeMines(1)">+</button>
    </div>

    <input id="bet" type="number" value="100">

    <button onclick="startGame()" class="btn play">Играть</button>
    <button onclick="cashout()" class="btn take">Забрать</button>

    <div>Коэф: <span id="coef">1.00</span></div>

</div>

<div id="popup" class="popup hidden">
    <h1>YOU WIN</h1>
    <p id="winText">0 ₽</p>
    <button onclick="closePopup()">Забрать</button>
</div>

<script src="script.js"></script>
</body>
</html>
