<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines - 3D Стеклянные Звезды</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #080d19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 40px;
            position: relative;
        }

        .top-bar {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .top-btn {
            background: #111a2e;
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            color: #8b9bb4;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .top-btn:hover {
            background: #192642;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.08);
        }

        .balance-box {
            background: #111a2e;
            padding: 10px 18px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: bold;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .main-game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 450px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            background: linear-gradient(145deg, #162136 0%, #080d18 100%);
            padding: 22px;
            border-radius: 36px;
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8),
                inset 0 3px 12px rgba(255, 255, 255, 0.05),
                0 0 25px rgba(28, 122, 148, 0.18);
            margin-bottom: 20px;
            position: relative;
        }

        .cell {
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(29, 137, 166, 0.85) 0%, rgba(13, 63, 77, 0.92) 100%);
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.3s ease, box-shadow 0.35s ease, background 0.35s ease, border-color 0.35s ease;
            box-shadow: 
                inset 0 5px 12px rgba(255, 255, 255, 0.3),
                inset 0 -4px 10px rgba(0, 0, 0, 0.5),
                0 4px 8px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .cell::before {
            content: '';
            position: absolute;
            top: 4%;
            left: 8%;
            width: 84%;
            height: 38%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 100%);
            border-radius: 12px 12px 6px 6px;
            pointer-events: none;
        }

        .cell::after {
            content: '';
            position: absolute;
            top: 10%;
            right: 8%;
            width: 12%;
            height: 80%;
            background: linear-gradient(to right, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 100%);
            border-radius: 50%;
            pointer-events: none;
        }

        .cell:hover {
            transform: translateY(-4px) scale(1.03);
            background: linear-gradient(135deg, rgba(35, 163, 199, 0.9) 0%, rgba(15, 74, 91, 0.95) 100%);
            box-shadow: 
                inset 0 7px 16px rgba(255, 255, 255, 0.4),
                inset 0 -4px 12px rgba(0, 0, 0, 0.4),
                0 12px 22px rgba(28, 122, 148, 0.4),
                0 0 10px rgba(255, 255, 255, 0.2);
        }

        .cell:active {
            transform: translateY(2px) scale(0.97);
        }

        .cell.revealed {
            background: transparent;
            border: none;
            cursor: default;
            transform: none !important;
            box-shadow: none;
        }

        .cell.revealed::before, 
        .cell.revealed::after {
            display: none;
        }

        .star-container {
            width: 90%;
            height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
            animation: appearStar 0.35s ease-out forwards;
            filter: drop-shadow(0px 8px 12px rgba(255, 120, 0, 0.5));
        }

        @keyframes appearStar {
            0% { 
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.6); 
            }
            100% { 
                opacity: 1;
                transform: translate(-50%, -50%) scale(1); 
            }
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0d1524;
            padding: 18px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .panel-3d {
            background: linear-gradient(145deg, #10192d 0%, #070e1b 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: inset 0 2px 8px rgba(255, 255, 255, 0.03), 0 4px 12px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .max-win-box {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #8b9bb4;
            font-size: 13px;
        }

        .max-win-box span {
            color: #10b981; /* Green color */
            font-weight: bold;
        }

        .star-icon-small {
            width: 22px;
            height: 22px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .traps-selector {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #162138;
            border-radius: 10px;
            padding: 2px 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .traps-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s;
        }

        .traps-btn:hover {
            color: #38bdf8;
        }

        .traps-number {
            font-weight: bold;
            font-size: 15px;
            min-width: 20px;
            text-align: center;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .bet-input-wrapper {
            display: flex;
            align-items: center;
            background: #162138;
            border-radius: 12px;
            padding: 6px 14px;
            width: 100%;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .bet-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 2px 8px;
            transition: color 0.2s;
        }

        .bet-btn:hover {
            color: #38bdf8;
        }

        .bet-input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            width: 90px;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        .bet-currency {
            color: #8b9bb4;
            font-size: 14px;
            margin-right: 4px;
            font-weight: bold;
        }

        .play-btn {
            width: 100%;
            background: #0077ff; /* Blue */
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 119, 255, 0.3);
        }

        .play-btn:hover {
            background: #0066e6;
            box-shadow: 0 6px 16px rgba(0, 119, 255, 0.4);
            transform: translateY(-1px);
        }

        .play-btn:disabled {
            background: #202c44;
            color: #596a8a;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .collect-btn-active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4) !important;
        }
        .collect-btn-active:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%) !important;
        }

        /* Modal / Win Notification */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(8, 13, 25, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal-card {
            background: linear-gradient(145deg, #10192d 0%, #070e1b 100%);
            border: 2px solid rgba(16, 185, 129, 0.3);
            border-radius: 32px;
            padding: 40px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(16, 185, 129, 0.2);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-active {
            display: flex;
            opacity: 1;
        }

        .modal-active .modal-card {
            transform: scale(1);
        }

        .modal-icon-wrapper {
            width: 80px;
            height: 80px;
            background: rgba(16, 185, 129, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
            animation: pulseIcon 2s infinite alternate;
        }

        @keyframes pulseIcon {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .modal-title {
            color: #10b981;
            font-size: 17px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .modal-amount {
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 24px;
            text-shadow: 0 2px 10px rgba(255,255,255,0.2);
        }

        .modal-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }

        .modal-btn:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            transform: translateY(-1px);
        }

        /* Confetti Container */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0;
            z-index: 101;
        }

        @keyframes confetti-fall {
            0% {
                opacity: 1;
                transform: translateY(-20px) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(500px) rotate(720deg);
            }
        }
    </style>
</head>
<body>

    <!-- Верхняя панель -->
    <div class="top-bar">
        <button class="top-btn">🎵</button>
        <div class="balance-box" id="balance-amount">10 539,61 ₽</div>
        <button class="top-btn">❓ Как играть</button>
    </div>

    <!-- Игровая область -->
    <div class="main-game-area">
        <div class="game-board" id="board">
            <!-- Клетки генерируются через JS -->
        </div>

        <div class="controls">
            <!-- 3D Панель -->
            <div class="panel-3d">
                <div class="max-win-box">
                    <svg class="star-icon-small" viewBox="0 0 100 100">
                        <polygon points="50,5 63,35 95,38 70,59 78,92 50,74 22,92 30,59 5,38 37,35" fill="#ffaa00" stroke="#ffcc00" stroke-width="2"/>
                    </svg>
                    <span id="panel-label">Макс. выигрыш:</span> <span id="max-win">0.00 ₽</span>
                </div>
                <div class="traps-selector" id="traps-selector">
                    <button class="traps-btn" onclick="changeTraps(-1)">‹</button>
                    <span class="traps-number" id="traps-count">3</span>
                    <button class="traps-btn" onclick="changeTraps(1)">›</button>
                </div>
            </div>

            <div class="control-row">
                <div class="bet-input-wrapper" id="bet-input-wrapper">
                    <button class="bet-btn" onclick="adjustBet(-1)">-</button>
                    <input type="text" class="bet-input" id="bet-amount" value="0.30" readonly>
                    <span class="bet-currency">₽</span>
                    <button class="bet-btn" onclick="adjustBet(1)">+</button>
                </div>
            </div>

            <button class="play-btn" id="play-button" onclick="handleGameAction()">Играть</button>
        </div>
    </div>

    <!-- Модальное окно выигрыша -->
    <div class="modal-overlay" id="win-modal">
        <div class="modal-card">
            <div class="modal-icon-wrapper">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <div class="modal-title">Выигрыш зачислен!</div>
            <div class="modal-amount" id="modal-win-amount">0.00 ₽</div>
            <button class="modal-btn" onclick="closeModal()">Отлично</button>
        </div>
    </div>

    <!-- Контейнер для конфетти -->
    <div id="confetti-container" style="position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index: 100; overflow: hidden;"></div>

    <script>
        const board = document.getElementById('board');
        const trapsCountEl = document.getElementById('traps-count');
        const betAmountEl = document.getElementById('bet-amount');
        const balanceEl = document.getElementById('balance-amount');
        const playBtn = document.getElementById('play-button');
        const maxWinEl = document.getElementById('max-win');
        const panelLabel = document.getElementById('panel-label');
        const trapsSelector = document.getElementById('traps-selector');
        const betWrapper = document.getElementById('bet-input-wrapper');
        
        let traps = 3;
        let currentBet = 0.30;
        let balance = 10539.61;
        
        let gameActive = false;
        let revealedStars = 0;
        let currentMultiplier = 1.00;
        
        function updateBalanceUI() {
            balanceEl.textContent = balance.toLocaleString('ru-RU', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + ' ₽';
        }
        updateBalanceUI();

        function changeTraps(val) {
            if (gameActive) return;
            traps = Math.max(1, Math.min(24, traps + val));
            trapsCountEl.textContent = traps;
            recalculateMaxWin();
        }

        function adjustBet(val) {
            if (gameActive) return;
            currentBet = Math.max(0.10, currentBet + val);
            betAmountEl.value = currentBet.toFixed(2);
            recalculateMaxWin();
        }

        function recalculateMaxWin() {
            if (gameActive) return;
            let maxPotential = currentBet * Math.pow(1.2, (25 - traps));
            maxWinEl.textContent = maxPotential.toFixed(2) + ' ₽';
        }
        recalculateMaxWin();

        function handleGameAction() {
            if (!gameActive) {
                // Игра начинается
                if (balance < currentBet) {
                    alert("Недостаточно средств на балансе!");
                    return;
                }

                balance -= currentBet;
                updateBalanceUI();

                gameActive = true;
                revealedStars = 0;
                currentMultiplier = 1.00;

                panelLabel.textContent = "Текущий коэфф:";
                maxWinEl.textContent = "x" + currentMultiplier.toFixed(2);

                playBtn.textContent = "Забрать " + (currentBet * currentMultiplier).toFixed(2) + " ₽";
                playBtn.classList.add('collect-btn-active');

                trapsSelector.style.opacity = '0.3';
                betWrapper.style.opacity = '0.3';
                betWrapper.style.pointerEvents = 'none';

                renderBoard();
            } else {
                // Забрать выигрыш
                collectWinnings();
            }
        }

        function renderBoard() {
            board.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                
                cell.addEventListener('click', function() {
                    if (!gameActive) return;
                    if (cell.classList.contains('revealed')) return;
                    
                    cell.classList.add('revealed');
                    cell.innerHTML = get3DStarSvg();
                    
                    revealedStars++;
                    currentMultiplier = 1.00 + (revealedStars * 0.38);
                    
                    // Обновляем панель коэффициентом и выигрышем в реальном времени
                    maxWinEl.textContent = "x" + currentMultiplier.toFixed(2);
                    playBtn.textContent = "Забрать " + (currentBet * currentMultiplier).toFixed(2) + " ₽";
                });
                
                board.appendChild(cell);
            }
        }
        renderBoard();

        function collectWinnings() {
            if (!gameActive) return;
            
            const wonAmount = currentBet * currentMultiplier;
            balance += wonAmount;
            updateBalanceUI();

            // Показываем модальное окно с конфетти
            showWinModal(wonAmount.toFixed(2) + ' ₽');
            
            gameActive = false;
            resetUI();
            renderBoard();
        }

        function resetUI() {
            playBtn.textContent = "Играть";
            playBtn.classList.remove('collect-btn-active');
            panelLabel.textContent = "Макс. выигрыш:";
            recalculateMaxWin();
            
            trapsSelector.style.opacity = '1';
            betWrapper.style.opacity = '1';
            betWrapper.style.pointerEvents = 'all';
        }

        function get3DStarSvg() {
            return `
            <div class="star-container">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <defs>
                        <linearGradient id="starBody" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fffa80" />
                            <stop offset="30%" stop-color="#ffcc00" />
                            <stop offset="75%" stop-color="#ff7700" />
                            <stop offset="100%" stop-color="#b32400" />
                        </linearGradient>

                        <radialGradient id="glassShine" cx="35%" cy="30%" r="55%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                            <stop offset="50%" stop-color="#ffcc00" stop-opacity="0.4" />
                            <stop offset="100%" stop-color="#ff6600" stop-opacity="0" />
                        </radialGradient>

                        <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
                            <stop offset="50%" stop-color="#ffdd66" stop-opacity="0.5" />
                            <stop offset="100%" stop-color="#ffaa00" stop-opacity="0" />
                        </radialGradient>

                        <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
                        </filter>
                    </defs>

                    <path d="M 50 14 L 61 38 L 86 38 L 66 54 L 74 78 L 50 63 L 26 78 L 34 54 L 14 38 L 39 38 Z" 
                          fill="url(#starBody)" 
                          stroke="#ffaa00" 
                          stroke-width="1.5"
                          filter="url(#shadow3d)" />

                    <path d="M 50 14 L 61 38 L 86 38 L 66 54 L 74 78 L 50 63 L 26 78 L 34 54 L 14 38 L 39 38 Z" 
                          fill="url(#glassShine)" />

                    <path d="M 50 22 L 57 37 L 72 37 L 60 46 L 65 61 L 50 51 L 35 61 L 40 46 L 28 37 L 43 37 Z" 
                          fill="url(#innerGlow)" 
                          opacity="0.9" />
                </svg>
            </div>
            `;
        }

        function showWinModal(amountText) {
            document.getElementById('modal-win-amount').textContent = amountText;
            document.getElementById('win-modal').classList.add('modal-active');
            triggerConfetti();
        }

        function closeModal() {
            document.getElementById('win-modal').classList.remove('modal-active');
        }

        function triggerConfetti() {
            const container = document.getElementById('confetti-container');
            container.innerHTML = '';
            const colors = ['#10b981', '#38bdf8', '#fbbf24', '#ff7700', '#0077ff'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-20px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                
                // размеры
                const size = Math.random() * 8 + 4;
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';
                
                container.appendChild(confetti);
                
                confetti.style.animation = `confetti-fall 3s cubic-bezier(0.1, 0.8, 0.3, 1) forwards`;
                confetti.style.animationDelay = Math.random() * 2.5 + 's';
            }
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
