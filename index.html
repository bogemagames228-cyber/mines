<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines - 3D Стеклянные Звезды</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #080d19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 40px;
            position: relative;
            overflow-x: hidden;
        }

        /* Верхняя панель */
        .top-bar {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .top-btn {
            background: #111a2e;
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            color: #8b9bb4;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .top-btn:hover {
            background: #192642;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.08);
        }

        .balance-box {
            background: #111a2e;
            padding: 10px 18px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: bold;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* Игровая область */
        .main-game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 450px;
        }

        /* 3D Оправа поля */
        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            background: linear-gradient(145deg, #162136 0%, #080d18 100%);
            padding: 22px;
            border-radius: 36px;
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8),
                inset 0 3px 12px rgba(255, 255, 255, 0.05),
                0 0 25px rgba(28, 122, 148, 0.18);
            margin-bottom: 20px;
            position: relative;
        }

        /* Глянцевые ячейки */
        .cell {
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(29, 137, 166, 0.85) 0%, rgba(13, 63, 77, 0.92) 100%);
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.3s ease, box-shadow 0.35s ease, background 0.35s ease, border-color 0.35s ease;
            box-shadow: 
                inset 0 5px 12px rgba(255, 255, 255, 0.3),
                inset 0 -4px 10px rgba(0, 0, 0, 0.5),
                0 4px 8px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Многослойные глянцевые блики (эффект стекла) */
        .cell::before {
            content: '';
            position: absolute;
            top: 4%;
            left: 8%;
            width: 84%;
            height: 38%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 100%);
            border-radius: 12px 12px 6px 6px;
            pointer-events: none;
        }

        .cell::after {
            content: '';
            position: absolute;
            top: 10%;
            right: 8%;
            width: 12%;
            height: 80%;
            background: linear-gradient(to right, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 100%);
            border-radius: 50%;
            pointer-events: none;
        }

        .cell:hover {
            transform: translateY(-4px) scale(1.03);
            background: linear-gradient(135deg, rgba(35, 163, 199, 0.9) 0%, rgba(15, 74, 91, 0.95) 100%);
            box-shadow: 
                inset 0 7px 16px rgba(255, 255, 255, 0.4),
                inset 0 -4px 12px rgba(0, 0, 0, 0.4),
                0 12px 22px rgba(28, 122, 148, 0.4),
                0 0 10px rgba(255, 255, 255, 0.2);
        }

        .cell:active {
            transform: translateY(2px) scale(0.97);
        }

        /* Открытая ячейка: рамка и фон исчезают, ячейка становится полностью прозрачной */
        .cell.revealed {
            background: transparent;
            border: none;
            cursor: default;
            transform: none !important;
            box-shadow: none;
        }

        .cell.revealed::before, 
        .cell.revealed::after {
            display: none;
        }

        /* 3D Стеклянная звезда */
        .star-container {
            width: 90%;
            height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
            /* Плавное появление без подпрыгивания */
            animation: appearStar 0.35s ease-out forwards;
            filter: drop-shadow(0px 8px 12px rgba(255, 120, 0, 0.5));
        }

        @keyframes appearStar {
            0% { 
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.6); 
            }
            100% { 
                opacity: 1;
                transform: translate(-50%, -50%) scale(1); 
            }
        }

        /* Панель управления */
        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0d1524;
            padding: 18px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111a2c;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .max-win-box {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8b9bb4;
            font-size: 13px;
        }

        .max-win-box span {
            color: #fbbf24;
            font-weight: bold;
        }

        .traps-selector {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #162138;
            border-radius: 10px;
            padding: 2px 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .traps-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s;
        }

        .traps-btn:hover {
            color: #38bdf8;
        }

        .traps-number {
            font-weight: bold;
            font-size: 15px;
            min-width: 20px;
            text-align: center;
        }

        .bet-input-wrapper {
            display: flex;
            align-items: center;
            background: #162138;
            border-radius: 10px;
            padding: 4px 10px;
            width: 100%;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .bet-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s;
        }

        .bet-btn:hover {
            color: #38bdf8;
        }

        .bet-input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            width: 100px;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        .bet-currency {
            color: #8b9bb4;
            font-size: 13px;
            margin-right: 4px;
        }

        /* Дополнительный блок: Выигрыш и коэффициент */
        .win-display {
            display: none;
            justify-content: space-between;
            align-items: center;
            background: #142036;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin-bottom: 4px;
        }

        .win-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .win-title {
            color: #8b9bb4;
            font-size: 12px;
        }

        .win-multiplier {
            color: #38bdf8;
            font-weight: bold;
            font-size: 16px;
        }

        .win-amount {
            color: #fbbf24;
            font-weight: bold;
            font-size: 16px;
        }

        .collect-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .collect-btn:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            transform: translateY(-1px);
        }

        .play-btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .play-btn:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
            transform: translateY(-1px);
        }

        .play-btn:disabled {
            background: #202c44;
            color: #596a8a;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="top-btn">🎵</button>
        <div class="balance-box" id="balance-amount">10 539,61 Br</div>
        <button class="top-btn">❓ Как играть</button>
    </div>

    <div class="main-game-area">
        <div class="game-board" id="board">
            </div>

        <div class="win-display" id="win-display">
            <div class="win-info">
                <span class="win-title">Текущий выигрыш:</span>
                <span class="win-multiplier" id="display-coeff">x1.00</span>
                <span class="win-amount" id="display-win">0.00 Br</span>
            </div>
            <button class="collect-btn" onclick="collectWinnings()">Забрать</button>
        </div>

        <div class="controls">
            <div class="control-row">
                <div class="max-win-box">
                    ⭐ Макс. выигрыш: <span id="max-win">0.00 Br</span>
                </div>
                <div class="traps-selector">
                    <button class="traps-btn" onclick="changeTraps(-1)">‹</button>
                    <span class="traps-number" id="traps-count">3</span>
                    <button class="traps-btn" onclick="changeTraps(1)">›</button>
                </div>
            </div>

            <div class="control-row">
                <div class="bet-input-wrapper">
                    <button class="bet-btn" onclick="adjustBet(-1)">-</button>
                    <input type="text" class="bet-input" id="bet-amount" value="0.30" readonly>
                    <span class="bet-currency">Br</span>
                    <button class="bet-btn" onclick="adjustBet(1)">+</button>
                </div>
            </div>

            <button class="play-btn" id="play-button" onclick="startGame()">Играть</button>
        </div>
    </div>

    <script>
        const board = document.getElementById('board');
        const trapsCountEl = document.getElementById('traps-count');
        const betAmountEl = document.getElementById('bet-amount');
        const balanceEl = document.getElementById('balance-amount');
        const playBtn = document.getElementById('play-button');
        const winDisplay = document.getElementById('win-display');
        const displayCoeff = document.getElementById('display-coeff');
        const displayWin = document.getElementById('display-win');
        const maxWinEl = document.getElementById('max-win');
        
        let traps = 3;
        let currentBet = 0.30;
        let balance = 10539.61;
        
        let gameActive = false;
        let revealedStars = 0;
        let baseMultiplier = 1.00;
        let currentMultiplier = 1.00;
        
        // Обновление UI баланса
        function updateBalanceUI() {
            balanceEl.textContent = balance.toLocaleString('ru-RU', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + ' Br';
        }
        updateBalanceUI();

        function changeTraps(val) {
            if (gameActive) return;
            traps = Math.max(1, Math.min(24, traps + val));
            trapsCountEl.textContent = traps;
            recalculateMaxWin();
        }

        function adjustBet(val) {
            if (gameActive) return;
            currentBet = Math.max(0.10, currentBet + val);
            betAmountEl.value = currentBet.toFixed(2);
            recalculateMaxWin();
        }

        function recalculateMaxWin() {
            // Упрощенный расчет макс. выигрыша
            let maxPotential = currentBet * Math.pow(1.2, (25 - traps));
            maxWinEl.textContent = maxPotential.toFixed(2) + ' Br';
        }
        recalculateMaxWin();

        function startGame() {
            if (balance < currentBet) {
                alert("Недостаточно средств на балансе!");
                return;
            }

            // Списываем ставку
            balance -= currentBet;
            updateBalanceUI();

            gameActive = true;
            revealedStars = 0;
            currentMultiplier = 1.00;
            playBtn.disabled = true;
            winDisplay.style.display = 'none'; // до первой открытой звезды

            // Очищаем и пересоздаем ячейки
            renderBoard();
        }

        function renderBoard() {
            board.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                
                cell.addEventListener('click', function() {
                    if (!gameActive) return;
                    if (cell.classList.contains('revealed')) return;
                    
                    // Открываем ячейку
                    cell.classList.add('revealed');
                    cell.innerHTML = get3DStarSvg();
                    
                    revealedStars++;
                    
                    // Увеличиваем коэффициент
                    currentMultiplier = 1.00 + (revealedStars * 0.38);
                    
                    // Показываем блок с выигрышем
                    winDisplay.style.display = 'flex';
                    displayCoeff.textContent = 'x' + currentMultiplier.toFixed(2);
                    displayWin.textContent = (currentBet * currentMultiplier).toFixed(2) + ' Br';
                });
                
                board.appendChild(cell);
            }
        }
        renderBoard(); // Создаем ячейки для начала

        function collectWinnings() {
            if (!gameActive) return;
            
            const wonAmount = currentBet * currentMultiplier;
            balance += wonAmount;
            updateBalanceUI();

            alert(`Вы забрали выигрыш: ${wonAmount.toFixed(2)} Br!`);
            
            // Сбрасываем игру
            gameActive = false;
            winDisplay.style.display = 'none';
            playBtn.disabled = false;
            renderBoard(); // сбрасываем доску
        }

        // SVG шаблон для 3D стеклянной звезды с правильной геометрией
        function get3DStarSvg() {
            return `
            <div class="star-container">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <defs>
                        <linearGradient id="starBody" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fffa80" />
                            <stop offset="30%" stop-color="#ffcc00" />
                            <stop offset="75%" stop-color="#ff7700" />
                            <stop offset="100%" stop-color="#b32400" />
                        </linearGradient>

                        <radialGradient id="glassShine" cx="35%" cy="30%" r="55%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                            <stop offset="50%" stop-color="#ffcc00" stop-opacity="0.4" />
                            <stop offset="100%" stop-color="#ff6600" stop-opacity="0" />
                        </radialGradient>

                        <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
                            <stop offset="50%" stop-color="#ffdd66" stop-opacity="0.5" />
                            <stop offset="100%" stop-color="#ffaa00" stop-opacity="0" />
                        </radialGradient>

                        <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
                        </filter>
                    </defs>

                    <path d="M 50 14 L 61 38 L 86 38 L 66 54 L 74 78 L 50 63 L 26 78 L 34 54 L 14 38 L 39 38 Z" 
                          fill="url(#starBody)" 
                          stroke="#ffaa00" 
                          stroke-width="1.5"
                          filter="url(#shadow3d)" />

                    <path d="M 50 14 L 61 38 L 86 38 L 66 54 L 74 78 L 50 63 L 26 78 L 34 54 L 14 38 L 39 38 Z" 
                          fill="url(#glassShine)" />

                    <path d="M 50 22 L 57 37 L 72 37 L 60 46 L 65 61 L 50 51 L 35 61 L 40 46 L 28 37 L 43 37 Z" 
                          fill="url(#innerGlow)" 
                          opacity="0.9" />
                </svg>
            </div>
            `;
        }
    </script>
</body>
</html>
