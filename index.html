<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines - Deep Stars & 3D Cracks</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #050812;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 40px;
            position: relative;
            overflow-x: hidden;
        }

        /* ----- Фоновые декорации: 3D Трещины и Кристаллы ----- */
        .bg-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Летающие искорки (оставляем) */
        .spark {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8, 0 0 15px rgba(56, 189, 248, 0.7);
            animation: floatSpark 4s infinite ease-in-out;
            opacity: 0;
        }

        @keyframes floatSpark {
            0% { transform: translateY(0) translateX(0) scale(0.8); opacity: 0; }
            20% { opacity: 0.9; }
            80% { opacity: 0.9; }
            100% { transform: translateY(-300px) translateX(50px) scale(0.4); opacity: 0; }
        }

        /* 3D ТРЕЩИНЫ - Эффект объема земли */
        .crack-wrapper {
            position: absolute;
            transform-origin: center;
        }

        .earth-crack {
            background: linear-gradient(135deg, #02040a 0%, #080d18 50%, #02040a 100%);
            border-radius: 4px;
            /* Внутренние тени создают глубину, внешние - неровный край земли */
            box-shadow: 
                inset 5px 5px 15px rgba(0, 0, 0, 0.9),
                inset -3px -3px 8px rgba(0, 0, 0, 0.6),
                5px 5px 20px rgba(0, 0, 0, 0.7),
                -3px -3px 10px rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.04); /* Легкий контур края земли */
            position: relative;
            overflow: hidden; /* Чтобы кристалл был "внутри" */
        }

        /* Эффект свечения из глубины трещины */
        .earth-crack::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(56, 189, 248, 0.3) 0%, transparent 70%);
            opacity: 0.7;
        }

        /* Кристалл, выглядывающий из трещины (3D SVG) */
        .crack-gem {
            position: absolute;
            transform: scale(0.8); /* Утапливаем внутрь */
            animation: pulseCrackGem 3s infinite alternate ease-in-out;
        }

        @keyframes pulseCrackGem {
            0% { transform: scale(0.8) translateY(2px) rotate(0deg); filter: brightness(1) drop-shadow(0 0 10px #38bdf8); }
            100% { transform: scale(0.85) translateY(-2px) rotate(5deg); filter: brightness(1.3) drop-shadow(0 0 20px #bae6fd); }
        }

        /* Позиционирование трещин */
        .cw-1 {
            top: 25%;
            left: 5%;
            width: 250px;
            height: 60px;
            transform: rotate(-28deg);
        }
        .cw-1 .crack-gem { bottom: -5px; right: 20%; }

        .cw-2 {
            top: 58%;
            right: 8%;
            width: 220px;
            height: 50px;
            transform: rotate(32deg);
        }
        .cw-2 .crack-gem { top: -8px; left: 15%; }

        .cw-3 {
            bottom: 22%;
            left: 18%;
            width: 280px;
            height: 70px;
            transform: rotate(8deg);
        }
        .cw-3 .crack-gem { center: center; left: 40%; transform: translate(-50%, -50%); }

        /* ----- UI Элементы (верхняя панель, поле, кнопки) ----- */
        .top-bar {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .top-btn {
            background: #111a2e;
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            color: #8b9bb4;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: 0.2s ease;
        }

        .top-btn:hover { background: #192642; color: #fff; }

        .balance-box {
            background: #111a2e;
            padding: 10px 18px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: bold;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(56, 189, 248, 0.1);
        }

        .main-game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 450px;
            margin-bottom: 60px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            background: linear-gradient(145deg, rgba(22, 33, 54, 0.8) 0%, rgba(8, 13, 24, 0.95) 100%);
            padding: 24px;
            border-radius: 36px;
            border: 1.5px solid rgba(56, 189, 248, 0.2);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8),
                inset 0 3px 12px rgba(255, 255, 255, 0.05),
                0 0 25px rgba(28, 122, 148, 0.18);
            margin-bottom: 24px;
            position: relative;
        }

        .cell {
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(29, 137, 166, 0.8) 0%, rgba(13, 63, 77, 0.85) 100%);
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
            box-shadow: 
                inset 0 4px 10px rgba(255, 255, 255, 0.3),
                inset 0 -3px 7px rgba(0, 0, 0, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .cell:hover {
            transform: translateY(-3px) scale(1.03);
            background: linear-gradient(135deg, rgba(35, 163, 199, 0.9) 0%, rgba(15, 74, 91, 0.95) 100%);
            box-shadow: 
                inset 0 5px 14px rgba(255, 255, 255, 0.4),
                inset 0 -3px 8px rgba(0, 0, 0, 0.3),
                0 10px 20px rgba(56, 189, 248, 0.35);
        }

        .cell.revealed {
            background: transparent;
            border: none;
            cursor: default;
            transform: none !important;
            box-shadow: none;
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0d1524;
            padding: 18px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .panel-3d {
            background: linear-gradient(145deg, #10192d 0%, #070e1b 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: inset 0 2px 8px rgba(255, 255, 255, 0.03), 0 4px 12px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .play-btn {
            width: 100%;
            background: #0077ff;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 119, 255, 0.3);
        }

        .play-btn:hover { background: #0066e6; box-shadow: 0 6px 16px rgba(0, 119, 255, 0.4); transform: translateY(-1px); }

        /* ----- Нижняя панель с 3D Камнями и Алмазами ----- */
        .bottom-stones {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 90px;
            background: linear-gradient(to top, #050812, transparent);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 40px;
            padding-bottom: 20px;
            opacity: 0.9;
        }

        /* 3D Камень "Земли" - объем через тени */
        .stone-block {
            position: relative;
            width: 60px;
            height: 45px;
            background: linear-gradient(to bottom, #1e293b 0%, #0f172a 100%);
            border-radius: 8px 8px 3px 3px;
            box-shadow: 
                inset 4px 4px 10px rgba(255, 255, 255, 0.06),
                inset -3px -3px 6px rgba(0, 0, 0, 0.3),
                0 6px 15px rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        
        /* 3D Алмаз на камне (SVG) */
        .stone-gem {
            width: 32px;
            height: 32px;
            position: absolute;
            top: -16px; /* Выглядывает */
            filter: drop-shadow(0 0 10px #38bdf8);
            animation: pulseBottomGem 2.5s infinite alternate ease-in-out;
        }

        @keyframes pulseBottomGem {
            0% { transform: translateY(0) scale(1); filter: brightness(1) drop-shadow(0 0 8px #38bdf8); }
            100% { transform: translateY(-3px) scale(1.1); filter: brightness(1.2) drop-shadow(0 0 15px #bae6fd); }
        }

        /* ----- Окно Выигрыша ----- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(2, 4, 10, 0.9);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-card {
            background: linear-gradient(145deg, #10192d 0%, #070e1b 100%);
            border: 2px solid rgba(16, 185, 129, 0.3);
            border-radius: 32px;
            padding: 40px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(16, 185, 129, 0.2);
            animation: appearModal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes appearModal { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .sparkling-star-modal {
            font-size: 40px;
            color: #fbbf24;
            text-shadow: 0 0 15px #fbbf24, 0 0 25px #ea580c;
            animation: sparkleStarModal 1s infinite alternate;
        }

        @keyframes sparkleStarModal { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        .modal-title { color: #10b981; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .modal-amount { font-size: 40px; font-weight: 800; color: #fff; margin-bottom: 30px; }
        .modal-btn { background: #10b981; color: #fff; border: none; padding: 15px 30px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s ease; }
        .modal-btn:hover { background: #059669; transform: translateY(-1px); }

    </style>
</head>
<body>

    <div class="bg-decorations" id="bg-decorations">
        <div class="crack-wrapper cw-1">
            <div class="earth-crack" style="width: 100%; height: 100%;">
                <svg class="crack-gem" viewBox="0 0 100 100" width="50" height="50">
                    <polygon points="50,5 90,35 75,90 25,90 10,35" fill="#38bdf8" stroke="#7dd3fc" stroke-width="2" />
                    <polygon points="50,5 50,90 75,90 90,35" fill="#bae6fd" opacity="0.7"/>
                </svg>
            </div>
        </div>

        <div class="crack-wrapper cw-2">
            <div class="earth-crack" style="width: 100%; height: 100%;">
                <svg class="crack-gem" viewBox="0 0 100 100" width="45" height="45">
                    <polygon points="50,5 90,35 75,90 25,90 10,35" fill="#38bdf8" stroke="#7dd3fc" stroke-width="2" />
                </svg>
            </div>
        </div>

        <div class="crack-wrapper cw-3">
            <div class="earth-crack" style="width: 100%; height: 100%;">
                <svg class="crack-gem" viewBox="0 0 100 100" width="60" height="60">
                    <polygon points="50,5 90,35 75,90 25,90 10,35" fill="#bae6fd" stroke="#fff" stroke-width="2.5" />
                </svg>
            </div>
        </div>
    </div>

    <div class="top-bar">
        <button class="top-btn">🎵</button>
        <div class="balance-box" id="balance-amount">10 539,61 ₽</div>
        <button class="top-btn">❓ Как играть</button>
    </div>

    <div class="main-game-area">
        <div class="game-board" id="board"></div>

        <div class="win-display" id="win-display" style="display:none; width: 100%; padding: 15px; background: rgba(16, 185, 129, 0.1); border: 2px solid rgba(16, 185, 129, 0.3); border-radius: 15px; margin-bottom: 10px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <div style="color: #8b9bb4; font-size: 12px; margin-bottom: 2px;">Выигрыш:</div>
                    <div id="win-coeff" style="color: #38bdf8; font-weight:bold; font-size: 16px;">x1.00</div>
                    <div id="win-sum" style="color: #fbbf24; font-weight:bold; font-size: 16px;">0.00 ₽</div>
                </div>
                <button onclick="collectWinnings()" style="background: #10b981; color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer;">Забрать</button>
            </div>
        </div>

        <div class="controls">
            <div class="panel-3d">
                <div class="max-win-box">
                    <svg class="star-icon-small" viewBox="0 0 100 100"><polygon points="50,5 63,35 95,38 70,59 78,92 50,74 22,92 30,59 5,38 37,35" fill="#f59e0b" stroke="#d97706" stroke-width="2"/></svg>
                    Макс. выигрыш: <span id="max-win">0.00 ₽</span>
                </div>
                <div class="traps-selector">
                    <button class="traps-btn" onclick="changeTraps(-1)">‹</button>
                    <span class="traps-number" id="traps-count">3</span>
                    <button class="traps-btn" onclick="changeTraps(1)">›</button>
                </div>
            </div>
            <div class="control-row">
                <div class="bet-input-wrapper">
                    <button class="bet-btn" onclick="adjustBet(-1)">-</button>
                    <input type="text" class="bet-input" id="bet-amount" value="0.30" readonly>
                    <span class="bet-currency">₽</span>
                    <button class="bet-btn" onclick="adjustBet(1)">+</button>
                </div>
            </div>
            <button class="play-btn" id="play-button" onclick="startGame()">Играть</button>
        </div>
    </div>

    <div class="bottom-stones">
        <div class="stone-block">
            <svg class="stone-gem" viewBox="0 0 100 100"><polygon points="50,10 85,40 70,90 30,90 15,40" fill="#38bdf8" stroke="#7dd3fc" stroke-width="2"/></svg>
        </div>
        <div class="stone-block">
            <svg class="stone-gem" viewBox="0 0 100 100"><polygon points="50,10 85,40 70,90 30,90 15,40" fill="#bae6fd" stroke="#fff" stroke-width="2"/></svg>
        </div>
        <div class="stone-block">
            <svg class="stone-gem" viewBox="0 0 100 100"><polygon points="50,10 85,40 70,90 30,90 15,40" fill="#38bdf8" stroke="#7dd3fc" stroke-width="2"/></svg>
        </div>
        <div class="stone-block">
            <svg class="stone-gem" viewBox="0 0 100 100"><polygon points="50,10 85,40 70,90 30,90 15,40" fill="#bae6fd" stroke="#fff" stroke-width="2"/></svg>
        </div>
        <div class="stone-block">
            <svg class="stone-gem" viewBox="0 0 100 100"><polygon points="50,10 85,40 70,90 30,90 15,40" fill="#38bdf8" stroke="#7dd3fc" stroke-width="2"/></svg>
        </div>
    </div>

    <div class="modal-overlay" id="win-modal">
        <div class="modal-card">
            <div class="sparkling-star-modal">★</div>
            <div class="modal-title">ВЫ ВЫИГРАЛИ!</div>
            <div class="modal-amount" id="modal-win-amount">0.00 ₽</div>
            <button class="modal-btn" onclick="closeModal()">Забрать выигрыш</button>
        </div>
    </div>

    <script>
        const board = document.getElementById('board');
        const trapsCountEl = document.getElementById('traps-count');
        const betAmountEl = document.getElementById('bet-amount');
        const balanceEl = document.getElementById('balance-amount');
        const playBtn = document.getElementById('play-button');
        const winDisplay = document.getElementById('win-display');
        const winCoeffEl = document.getElementById('win-coeff');
        const winSumEl = document.getElementById('win-sum');
        
        let traps = 3;
        let currentBet = 0.30;
        let balance = 10539.61;
        let gameActive = false;
        let revealedStars = 0;
        let currentMultiplier = 1.00;

        // Генерация искорок
        for (let i = 0; i < 20; i++) {
            const spark = document.createElement('div');
            spark.classList.add('spark');
            spark.style.left = Math.random() * 100 + '%';
            spark.style.top = (30 + Math.random() * 50) + '%';
            spark.style.animationDelay = Math.random() * 4 + 's';
            document.getElementById('bg-decorations').appendChild(spark);
        }

        updateBalanceUI();
        recalculateMaxWin();

        function updateBalanceUI() {
            balanceEl.textContent = balance.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₽';
        }

        function changeTraps(val) { if (gameActive) return; traps = Math.max(1, Math.min(24, traps + val)); trapsCountEl.textContent = traps; recalculateMaxWin(); }
        function adjustBet(val) { if (gameActive) return; currentBet = Math.max(0.10, currentBet + val); betAmountEl.value = currentBet.toFixed(2); recalculateMaxWin(); }
        function recalculateMaxWin() { document.getElementById('max-win').textContent = (currentBet * Math.pow(1.2, (25 - traps))).toFixed(2) + ' ₽'; }

        function startGame() {
            if (balance < currentBet) { alert("Недостаточно ₽ на балансе!"); return; }
            balance -= currentBet; updateBalanceUI(); gameActive = true; revealedStars = 0; currentMultiplier = 1.00;
            playBtn.disabled = true; winDisplay.style.display = 'none'; renderBoard();
        }

        function renderBoard() {
            board.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.onclick = () => revealCell(cell);
                board.appendChild(cell);
            }
        }
        renderBoard();

        function revealCell(cell) {
            if (!gameActive || cell.classList.contains('revealed')) return;
            cell.classList.add('revealed');
            cell.innerHTML = `
                <div class="star-container">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <polygon points="50,5 63,35 95,38 70,59 78,92 50,74 22,92 30,59 5,38 37,35" fill="#f59e0b" stroke="#ea580c" stroke-width="2.5"/>
                        <polygon points="50,5 50,92 78,92 95,38" fill="#fbbf24" opacity="0.6"/>
                    </svg>
                </div>
            `;
            revealedStars++;
            currentMultiplier = 1.00 + (revealedStars * 0.38);
            winDisplay.style.display = 'block';
            winCoeffEl.textContent = 'x' + currentMultiplier.toFixed(2);
            winSumEl.textContent = (currentBet * currentMultiplier).toFixed(2) + ' ₽';
        }

        function collectWinnings() {
            if (!gameActive) return;
            const wonAmount = currentBet * currentMultiplier;
            balance += wonAmount; updateBalanceUI();
            document.getElementById('modal-win-amount').textContent = wonAmount.toFixed(2) + ' ₽';
            document.getElementById('win-modal').style.display = 'flex';
            gameActive = false; winDisplay.style.display = 'none'; playBtn.disabled = false; renderBoard();
        }

        function closeModal() { document.getElementById('win-modal').style.display = 'none'; }
    </script>
</body>
</html>
