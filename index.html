<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines 1 Win - Испытай удачу</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2e3d52;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #ffffff;
            text-shadow: 0 0 12px #67e8f9;
        }

        .subtitle {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin: 0 auto 30px;
            max-width: 400px;
            width: 100%;
        }

        .cell {
            aspect-ratio: 1;
            background-color: #047cd7;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cell:hover {
            transform: scale(1.04);
            background-color: #0588e8;
        }

        .cell.revealed {
            background-color: #1a2536; /* темнее фон */
            cursor: default;
            transform: none;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .cell .star {
            font-size: 32px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.8));
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Win Modal / Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            border: 2px solid rgba(96, 165, 250, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .overlay.active .modal {
            transform: translateY(0);
        }

        .modal-title {
            color: #60a5fa;
            font-size: 36px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(96, 165, 250, 0.4);
        }

        .modal-subtitle {
            color: #94a3b8;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .amount-box {
            background-color: rgba(4, 124, 215, 0.15);
            border: 1px solid rgba(4, 124, 215, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 32px;
        }

        .amount-text {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .collect-btn {
            background: linear-gradient(135deg, #047cd7, #02599e);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(4, 124, 215, 0.4);
            transition: filter 0.2s, transform 0.1s;
            width: 100%;
        }

        .collect-btn:hover {
            filter: brightness(1.1);
        }

        .collect-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ИСПЫТАЙ СВОЮ УДАЧУ В MINES 1 WIN</h1>
        </header>
        <div class="subtitle">Нажми любую клетку, чтобы испытать удачу.</div>

        <div class="game-board" id="board"></div>
    </div>

    <div class="overlay" id="winModal">
        <div class="modal">
            <div class="modal-title">YOU'VE WON!</div>
            <div class="modal-subtitle">Ваш выигрыш</div>
            <div class="amount-box">
                <div class="amount-text">500 000 P</div>
            </div>
            <button class="collect-btn" onclick="closeModal()">Забрать выигрыш</button>
        </div>
    </div>

    <script>
        const board = document.getElementById('board');
        const winModal = document.getElementById('winModal');
        const totalCells = 25;
        let clicks = 0;
        const requiredClicks = 6; // Количество нажатий, чтобы выиграть

        function createBoard() {
            board.innerHTML = '';
            for (let i = 0; i < totalCells; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                
                cell.addEventListener('click', function() {
                    if (cell.classList.contains('revealed')) return;
                    
                    cell.classList.add('revealed');
                    
                    // Добавляем 3Д звездочку
                    const starSpan = document.createElement('span');
                    starSpan.classList.add('star');
                    starSpan.innerHTML = '⭐';
                    cell.appendChild(starSpan);
                    
                    clicks++;
                    
                    if (clicks === requiredClicks) {
                        setTimeout(() => {
                            winModal.classList.add('active');
                        }, 500);
                    }
                });
                
                board.appendChild(cell);
            }
        }

        function closeModal() {
            winModal.classList.remove('active');
            clicks = 0;
            createBoard();
        }

        // Initialize board
        createBoard();
    </script>
</body>
</html>
