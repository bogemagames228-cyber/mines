<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines - Глянцевый симулятор</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #080d19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 40px;
            position: relative;
            overflow-x: hidden;
        }

        /* Верхняя панель */
        .top-bar {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .top-btn {
            background: #111a2e;
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            color: #8b9bb4;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .top-btn:hover {
            background: #192642;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.08);
        }

        .balance-box {
            background: #111a2e;
            padding: 10px 18px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: bold;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* Игровая область */
        .main-game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 450px;
        }

        /* 3D Оправа поля */
        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            background: linear-gradient(145deg, #162136 0%, #080d18 100%);
            padding: 22px;
            border-radius: 36px;
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8),
                inset 0 3px 12px rgba(255, 255, 255, 0.05),
                0 0 25px rgba(28, 122, 148, 0.18);
            margin-bottom: 20px;
            position: relative;
        }

        /* Глянцевые ячейки */
        .cell {
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(29, 137, 166, 0.85) 0%, rgba(13, 63, 77, 0.92) 100%);
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease, background 0.35s ease;
            box-shadow: 
                inset 0 5px 12px rgba(255, 255, 255, 0.3),
                inset 0 -4px 10px rgba(0, 0, 0, 0.5),
                0 4px 8px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Многослойные глянцевые блики (эффект стекла) */
        .cell::before {
            content: '';
            position: absolute;
            top: 4%;
            left: 8%;
            width: 84%;
            height: 38%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 100%);
            border-radius: 12px 12px 6px 6px;
            pointer-events: none;
        }

        .cell::after {
            content: '';
            position: absolute;
            top: 10%;
            right: 8%;
            width: 12%;
            height: 80%;
            background: linear-gradient(to right, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 100%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Анимация движения мыши */
        .cell:hover {
            transform: translateY(-6px) scale(1.04) rotateX(4deg) rotateY(-2deg);
            background: linear-gradient(135deg, rgba(35, 163, 199, 0.9) 0%, rgba(15, 74, 91, 0.95) 100%);
            box-shadow: 
                inset 0 7px 16px rgba(255, 255, 255, 0.4),
                inset 0 -4px 12px rgba(0, 0, 0, 0.4),
                0 12px 22px rgba(28, 122, 148, 0.4),
                0 0 10px rgba(255, 255, 255, 0.2);
        }

        .cell:active {
            transform: translateY(2px) scale(0.96);
        }

        /* Открытая ячейка */
        .cell.revealed {
            background: #0b1524;
            cursor: default;
            transform: none !important;
            box-shadow: 
                inset 0 4px 12px rgba(0, 0, 0, 0.8),
                0 1px 4px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .cell.revealed::before, 
        .cell.revealed::after {
            display: none;
        }

        .cell span {
            font-size: 28px;
            color: #fbbf24;
            text-shadow: 0 0 12px rgba(251, 191, 36, 0.8), 0 0 4px #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            80% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* Панель управления */
        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0d1524;
            padding: 18px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111a2c;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .max-win-box {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8b9bb4;
            font-size: 13px;
        }

        .max-win-box span {
            color: #fbbf24;
            font-weight: bold;
        }

        .traps-selector {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #162138;
            border-radius: 10px;
            padding: 2px 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .traps-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s;
        }

        .traps-btn:hover {
            color: #38bdf8;
        }

        .traps-number {
            font-weight: bold;
            font-size: 15px;
            min-width: 20px;
            text-align: center;
        }

        .bet-input-wrapper {
            display: flex;
            align-items: center;
            background: #162138;
            border-radius: 10px;
            padding: 4px 10px;
            width: 100%;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .bet-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s;
        }

        .bet-btn:hover {
            color: #38bdf8;
        }

        .bet-input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            width: 100px;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        .bet-currency {
            color: #8b9bb4;
            font-size: 13px;
            margin-right: 4px;
        }

        .play-btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .play-btn:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="top-btn">🎵</button>
        <div class="balance-box">10 539,61 Br</div>
        <button class="top-btn">❓ Как играть</button>
    </div>

    <div class="main-game-area">
        <div class="game-board" id="board">
            </div>

        <div class="controls">
            <div class="control-row">
                <div class="max-win-box">
                    ⭐ Макс. выигрыш: <span>0 Br</span>
                </div>
                <div class="traps-selector">
                    <button class="traps-btn" onclick="changeTraps(-1)">‹</button>
                    <span class="traps-number" id="traps-count">3</span>
                    <button class="traps-btn" onclick="changeTraps(1)">›</button>
                </div>
            </div>

            <div class="control-row">
                <div class="bet-input-wrapper">
                    <button class="bet-btn" onclick="adjustBet(-10)">-</button>
                    <input type="text" class="bet-input" id="bet-amount" value="0.00" readonly>
                    <span class="bet-currency">Br</span>
                    <button class="bet-btn" onclick="adjustBet(10)">+</button>
                </div>
            </div>

            <button class="play-btn" onclick="startGame()">Играть</button>
        </div>
    </div>

    <script>
        const board = document.getElementById('board');
        const trapsCountEl = document.getElementById('traps-count');
        const betAmountEl = document.getElementById('bet-amount');
        
        let traps = 3;
        let currentBet = 0.00;

        function changeTraps(val) {
            traps = Math.max(1, Math.min(24, traps + val));
            trapsCountEl.textContent = traps;
        }

        function adjustBet(val) {
            currentBet = Math.max(0.00, currentBet + val);
            betAmountEl.value = currentBet.toFixed(2);
        }

        function startGame() {
            alert("Игра началась!");
        }

        // Генерация 25 клеток
        for (let i = 0; i < 25; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            
            cell.addEventListener('click', function() {
                if (cell.classList.contains('revealed')) return;
                cell.classList.add('revealed');
                
                const starSpan = document.createElement('span');
                starSpan.innerHTML = '⭐';
                cell.appendChild(starSpan);
            });
            
            board.appendChild(cell);
        }
    </script>
</body>
</html>
