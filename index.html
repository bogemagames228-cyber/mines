<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Mines Game</title>

<link rel="stylesheet" href="style.css">

<!-- 3D -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- конфетти -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

<div class="top-bar">
    <button id="sound">🔊</button>
    <div class="balance">💰 <span id="balance">5000</span> ₽</div>
    <button>Как играть</button>
</div>

<div class="game-wrapper">
    <canvas id="bg"></canvas>
    <div id="grid" class="grid"></div>
</div>

<div class="controls">
    <div>
        Мины:
        <button onclick="changeMines(-1)">-</button>
        <span id="mineCount">3</span>
        <button onclick="changeMines(1)">+</button>
    </div>

    <input type="number" id="bet" value="100">

    <button class="play" onclick="startGame()">Играть</button>
    <button class="cashout" onclick="cashout()">Забрать</button>

    <div>Коэф: <span id="coef">1.00</span></div>
</div>

<div id="popup" class="popup hidden">
    <h1>YOU’VE WON!</h1>
    <p id="win">0 ₽</p>
    <button onclick="closePopup()">Забрать</button>
</div>

<script src="script.js"></script>
</body>
</html>
