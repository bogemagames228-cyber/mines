<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines - 3D Игровая</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #050813;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 40px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Искорки */
        .spark {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 12px #38bdf8, 0 0 20px #bae6fd;
            animation: floatSpark 5s infinite ease-in-out;
            opacity: 0;
        }

        @keyframes floatSpark {
            0% { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; }
            20% { opacity: 0.9; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-400px) translateX(80px) scale(0.3); opacity: 0; }
        }

        /* Трещины */
        .crack {
            position: absolute;
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.3), rgba(14, 165, 233, 0.6), rgba(56, 189, 248, 0.3));
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.4);
            border-radius: 2px;
            transform-origin: center;
        }
        
        .crack-1 {
            top: 25%;
            left: 8%;
            width: 280px;
            height: 4px;
            transform: rotate(-30deg);
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.4);
        }
        .crack-2 {
            top: 52%;
            right: 8%;
            width: 240px;
            height: 5px;
            transform: rotate(25deg);
        }
        .crack-3 {
            bottom: 28%;
            left: 15%;
            width: 260px;
            height: 4px;
            transform: rotate(-10deg);
        }

        /* 3D Алмазы */
        .gem-3d {
            position: absolute;
            width: 45px;
            height: 45px;
            filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.8));
            animation: floatGem3d 3.5s infinite alternate ease-in-out;
        }

        @keyframes floatGem3d {
            0% { transform: translateY(0) rotate(0deg) scale(0.95); }
            100% { transform: translateY(-12px) rotate(4deg) scale(1.05); }
        }

        .gem-1 { top: 32%; left: 15%; }
        .gem-2 { top: 58%; right: 20%; }
        .gem-3 { bottom: 35%; left: 22%; }

        /* Нижняя панель */
        .bottom-stones {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 90px;
            background: linear-gradient(to top, #050813, transparent);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 48px;
            padding-bottom: 20px;
        }

        .stone-container {
            position: relative;
            width: 50px;
            height: 40px;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border-radius: 12px 12px 4px 4px;
            box-shadow: inset 0 3px 8px rgba(255,255,255,0.1), 0 4px 12px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .stone-gem {
            width: 28px;
            height: 28px;
            position: absolute;
            top: -14px;
            filter: drop-shadow(0 0 10px #38bdf8);
            animation: pulseBottomGem 2.5s infinite alternate;
        }

        @keyframes pulseBottomGem {
            0% { transform: translateY(0) scale(1); filter: brightness(1); }
            100% { transform: translateY(-4px) scale(1.15); filter: brightness(1.4); }
        }

        /* Верхняя панель */
        .top-bar {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .top-btn {
            background: #0e172a;
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .top-btn:hover {
            background: #1e293b;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .balance-box {
            background: #0e172a;
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: bold;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(56, 189, 248, 0.1);
        }

        /* Игровая область */
        .main-game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 450px;
            margin-bottom: 70px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.7) 0%, rgba(2, 6, 23, 0.9) 100%);
            padding: 24px;
            border-radius: 36px;
            border: 1.5px solid rgba(56, 189, 248, 0.25);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8),
                inset 0 4px 16px rgba(255, 255, 255, 0.05),
                0 0 30px rgba(56, 189, 248, 0.15);
            margin-bottom: 24px;
            position: relative;
        }

        .cell {
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.8) 0%, rgba(3, 105, 161, 0.8) 100%);
            border-radius: 16px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, background 0.25s ease;
            box-shadow: 
                inset 0 4px 10px rgba(255, 255, 255, 0.3),
                inset 0 -4px 8px rgba(0, 0, 0, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .cell::before {
            content: '';
            position: absolute;
            top: 4%;
            left: 8%;
            width: 84%;
            height: 38%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 100%);
            border-radius: 14px 14px 6px 6px;
            pointer-events: none;
        }

        .cell::after {
            content: '';
            position: absolute;
            top: 10%;
            right: 8%;
            width: 12%;
            height: 80%;
            background: linear-gradient(to right, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
            border-radius: 50%;
            pointer-events: none;
        }

        .cell:hover {
            transform: translateY(-4px) scale(1.04);
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.9) 0%, rgba(2, 132, 199, 0.9) 100%);
            box-shadow: 
                inset 0 6px 16px rgba(255, 255, 255, 0.4),
                inset 0 -4px 10px rgba(0, 0, 0, 0.3),
                0 12px 24px rgba(56, 189, 248, 0.4),
                0 0 12px rgba(255, 255, 255, 0.2);
        }

        .cell:active {
            transform: translateY(2px) scale(0.96);
        }

        .cell.revealed {
            background: transparent;
            border: none;
            cursor: default;
            transform: none !important;
            box-shadow: none;
        }

        .cell.revealed::before, 
        .cell.revealed::after {
            display: none;
        }

        .star-container {
            width: 92%;
            height: 92%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            animation: appearStar 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            filter: drop-shadow(0 0 16px rgba(255, 120, 0, 0.7));
        }

        @keyframes appearStar {
            0% { 
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5); 
            }
            100% { 
                opacity: 1;
                transform: translate(-50%, -50%) scale(1); 
            }
        }

        /* Панель управления */
        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(15, 23, 42, 0.85);
            padding: 18px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .panel-3d {
            background: linear-gradient(145deg, #0e172a 0%, #030712 100%);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: inset 0 2px 8px rgba(255, 255, 255, 0.02), 0 4px 12px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .max-win-box {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #64748b;
            font-size: 13px;
        }

        .max-win-box span {
            color: #10b981;
            font-weight: bold;
        }

        .star-icon-small {
            width: 22px;
            height: 22px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .traps-selector {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #1e293b;
            border-radius: 10px;
            padding: 2px 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .traps-btn {
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s;
        }

        .traps-btn:hover {
            color: #38bdf8;
        }

        .traps-number {
            font-weight: bold;
            font-size: 15px;
            min-width: 20px;
            text-align: center;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .bet-input-wrapper {
            display: flex;
            align-items: center;
            background: #1e293b;
            border-radius: 12px;
            padding: 6px 14px;
            width: 100%;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .bet-btn {
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 18px;
            cursor: pointer;
            padding: 2px 8px;
            transition: color 0.2s;
        }

        .bet-btn:hover {
            color: #38bdf8;
        }

        .bet-input {
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 16px;
            width: 90px;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        .bet-currency {
            color: #64748b;
            font-size: 14px;
            margin-right: 4px;
            font-weight: bold;
        }

        .play-btn {
            width: 100%;
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(2, 132, 199, 0.35);
        }

        .play-btn:hover {
            background: #0369a1;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45);
            transform: translateY(-1px);
        }

        .play-btn:disabled {
            background: #1e293b;
            color: #475569;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .collect-btn-active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4) !important;
        }
        
        .collect-btn-active:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%) !important;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(2, 6, 23, 0.88);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal-card {
            background: linear-gradient(145deg, #0f172a 0%, #020617 100%);
            border: 2px solid rgba(16, 185, 129, 0.3);
            border-radius: 36px;
            padding: 40px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 24px 64px rgba(0,0,0,0.9), 0 0 48px rgba(16, 185, 129, 0.25);
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-active {
            display: flex;
            opacity: 1;
        }

        .modal-active .modal-card {
            transform: scale(1);
        }

        .modal-icon-wrapper {
            width: 84px;
            height: 84px;
            background: rgba(16, 185, 129, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            border: 1.5px solid rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.4);
            animation: pulseIcon 2s infinite alternate;
        }

        @keyframes pulseIcon {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .sparkling-star {
            font-size: 42px;
            color: #fbbf24;
            text-shadow: 0 0 16px #fbbf24, 0 0 24px #ea580c;
            animation: pulseStar 1.5s infinite alternate;
        }

        @keyframes pulseStar {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .modal-title {
            color: #34d399;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
        }

        .modal-amount {
            font-size: 42px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 32px;
            text-shadow: 0 4px 16px rgba(255,255,255,0.35);
        }

        .modal-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            padding: 18px 28px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
            transition: all 0.2s ease;
        }

        .modal-btn:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            transform: translateY(-1px);
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            opacity: 0;
            z-index: 101;
        }

        @keyframes confetti-fall {
            0% {
                opacity: 1;
                transform: translateY(-20px) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(550px) rotate(720deg);
            }
        }
    </style>
</head>
<body>

    <div class="bg-decorations" id="bg-decorations">
        <div class="crack crack-1"></div>
        <div class="crack crack-2"></div>
        <div class="crack crack-3"></div>

        <svg class="gem-3d gem-1" viewBox="0 0 100 100">
            <defs>
                <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="35%" stop-color="#38bdf8"/>
                    <stop offset="85%" stop-color="#0284c7"/>
                    <stop offset="100%" stop-color="#0c4a6e"/>
                </linearGradient>
                <linearGradient id="sh1" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <polygon points="50,5 90,35 65,85 35,85 10,35" fill="url(#g1)" stroke="#7dd3fc" stroke-width="1.5"/>
            <polygon points="50,5 50,85 65,85 90,35" fill="url(#sh1)"/>
        </svg>

        <svg class="gem-3d gem-2" viewBox="0 0 100 100">
            <defs>
                <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="35%" stop-color="#a855f7"/>
                    <stop offset="85%" stop-color="#6b21a8"/>
                    <stop offset="100%" stop-color="#3b0764"/>
                </linearGradient>
                <linearGradient id="sh2" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <polygon points="50,5 90,35 65,85 35,85 10,35" fill="url(#g2)" stroke="#c084fc" stroke-width="1.5"/>
            <polygon points="50,5 50,85 65,85 90,35" fill="url(#sh2)"/>
        </svg>

        <svg class="gem-3d gem-3" viewBox="0 0 100 100">
            <defs>
                <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="35%" stop-color="#34d399"/>
                    <stop offset="85%" stop-color="#047857"/>
                    <stop offset="100%" stop-color="#064e3b"/>
                </linearGradient>
                <linearGradient id="sh3" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <polygon points="50,5 90,35 65,85 35,85 10,35" fill="url(#g3)" stroke="#6ee7b7" stroke-width="1.5"/>
            <polygon points="50,5 50,85 65,85 90,35" fill="url(#sh3)"/>
        </svg>
    </div>

    <div class="top-bar">
        <button class="top-btn">🎵</button>
        <div class="balance-box" id="balance-amount">10 539,61 ₽</div>
        <button class="top-btn">❓ Как играть</button>
    </div>

    <div class="main-game-area">
        <div class="game-board" id="board"></div>

        <div class="controls">
            <div class="panel-3d">
                <div class="max-win-box">
                    <svg class="star-icon-small" viewBox="0 0 100 100">
                        <polygon points="50,5 63,35 95,38 70,59 78,92 50,74 22,92 30,59 5,38 37,35" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
                    </svg>
                    <span id="panel-label">Макс. выигрыш:</span> <span id="max-win">0.00 ₽</span>
                </div>
                <div class="traps-selector" id="traps-selector">
                    <button class="traps-btn" onclick="changeTraps(-1)">‹</button>
                    <span class="traps-number" id="traps-count">3</span>
                    <button class="traps-btn" onclick="changeTraps(1)">›</button>
                </div>
            </div>

            <div class="control-row">
                <div class="bet-input-wrapper" id="bet-input-wrapper">
                    <button class="bet-btn" onclick="adjustBet(-1)">-</button>
                    <input type="text" class="bet-input" id="bet-amount" value="0.30" readonly>
                    <span class="bet-currency">₽</span>
                    <button class="bet-btn" onclick="adjustBet(1)">+</button>
                </div>
            </div>

            <button class="play-btn" id="play-button" onclick="handleGameAction()">Играть</button>
        </div>
    </div>

    <div class="bottom-stones">
        <div class="stone-container">
            <svg class="stone-gem" viewBox="0 0 100 100">
                <polygon points="50,10 85,40 65,90 35,90 15,40" fill="#38bdf8" stroke="#7dd3fc" stroke-width="1.5" />
            </svg>
        </div>
        <div class="stone-container">
            <svg class="stone-gem" viewBox="0 0 100 100">
                <polygon points="50,10 85,40 65,90 35,90 15,40" fill="#a855f7" stroke="#c084fc" stroke-width="1.5" />
            </svg>
        </div>
        <div class="stone-container">
            <svg class="stone-gem" viewBox="0 0 100 100">
                <polygon points="50,10 85,40 65,90 35,90 15,40" fill="#34d399" stroke="#6ee7b7" stroke-width="1.5" />
            </svg>
        </div>
        <div class="stone-container">
            <svg class="stone-gem" viewBox="0 0 100 100">
                <polygon points="50,10 85,40 65,90 35,90 15,40" fill="#fbbf24" stroke="#fcd34d" stroke-width="1.5" />
            </svg>
        </div>
        <div class="stone-container">
            <svg class="stone-gem" viewBox="0 0 100 100">
                <polygon points="50,10 85,40 65,90 35,90 15,40" fill="#38bdf8" stroke="#7dd3fc" stroke-width="1.5" />
            </svg>
        </div>
    </div>

    <div class="modal-overlay" id="win-modal">
        <div class="modal-card">
            <div class="modal-icon-wrapper">
                <div class="sparkling-star">★</div>
            </div>
            <div class="modal-title">ВЫ ВЫИГРАЛИ!</div>
            <div class="modal-amount" id="modal-win-amount">0.00 ₽</div>
            <button class="modal-btn" onclick="closeModal()">Забрать выигрыш</button>
        </div>
    </div>

    <div id="confetti-container" style="position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index: 100; overflow: hidden;"></div>

    <script>
        const board = document.getElementById('board');
        const trapsCountEl = document.getElementById('traps-count');
        const betAmountEl = document.getElementById('bet-amount');
        const balanceEl = document.getElementById('balance-amount');
        const playBtn = document.getElementById('play-button');
        const maxWinEl = document.getElementById('max-win');
        const panelLabel = document.getElementById('panel-label');
        const trapsSelector = document.getElementById('traps-selector');
        const betWrapper = document.getElementById('bet-input-wrapper');
        const bgDecorations = document.getElementById('bg-decorations');
        
        let traps = 3;
        let currentBet = 0.30;
        let balance = 10539.61;
        
        let gameActive = false;
        let revealedStars = 0;
        let currentMultiplier = 1.00;
        
        // Генерация искорок
        function createSparks() {
            for (let i = 0; i < 24; i++) {
                const spark = document.createElement('div');
                spark.classList.add('spark');
                spark.style.left = Math.random() * 100 + '%';
                spark.style.top = (25 + Math.random() * 60) + '%';
                spark.style.animationDelay = Math.random() * 5 + 's';
                bgDecorations.appendChild(spark);
            }
        }
        createSparks();
        
        function updateBalanceUI() {
            balanceEl.textContent = balance.toLocaleString('ru-RU', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + ' ₽';
        }
        updateBalanceUI();

        function changeTraps(val) {
            if (gameActive) return;
            traps = Math.max(1, Math.min(24, traps + val));
            trapsCountEl.textContent = traps;
            recalculateMaxWin();
        }

        function adjustBet(val) {
            if (gameActive) return;
            currentBet = Math.max(0.10, currentBet + val);
            betAmountEl.value = currentBet.toFixed(2);
            recalculateMaxWin();
        }

        function recalculateMaxWin() {
            if (gameActive) return;
            let maxPotential = currentBet * Math.pow(1.2, (25 - traps));
            maxWinEl.textContent = maxPotential.toFixed(2) + ' ₽';
        }
        recalculateMaxWin();

        function handleGameAction() {
            if (!gameActive) {
                if (balance < currentBet) {
                    alert("Недостаточно средств на балансе!");
                    return;
                }

                balance -= currentBet;
                updateBalanceUI();

                gameActive = true;
                revealedStars = 0;
                currentMultiplier = 1.00;

                panelLabel.textContent = "Текущий коэфф:";
                maxWinEl.textContent = "x" + currentMultiplier.toFixed(2);

                playBtn.textContent = "Забрать " + (currentBet * currentMultiplier).toFixed(2) + " ₽";
                playBtn.classList.add('collect-btn-active');

                trapsSelector.style.opacity = '0.3';
                betWrapper.style.opacity = '0.3';
                betWrapper.style.pointerEvents = 'none';

                renderBoard();
            } else {
                collectWinnings();
            }
        }

        function renderBoard() {
            board.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                
                cell.addEventListener('click', function() {
                    if (!gameActive) return;
                    if (cell.classList.contains('revealed')) return;
                    
                    cell.classList.add('revealed');
                    cell.innerHTML = get3DStarSvg();
                    
                    revealedStars++;
                    currentMultiplier = 1.00 + (revealedStars * 0.38);
                    
                    maxWinEl.textContent = "x" + currentMultiplier.toFixed(2);
                    playBtn.textContent = "Забрать " + (currentBet * currentMultiplier).toFixed(2) + " ₽";
                });
                
                board.appendChild(cell);
            }
        }
        renderBoard();

        function collectWinnings() {
            if (!gameActive) return;
            
            const wonAmount = currentBet * currentMultiplier;
            balance += wonAmount;
            updateBalanceUI();

            showWinModal(wonAmount.toFixed(2) + ' ₽');
            
            gameActive = false;
            resetUI();
            renderBoard();
        }

        function resetUI() {
            playBtn.textContent = "Играть";
            playBtn.classList.remove('collect-btn-active');
            panelLabel.textContent = "Макс. выигрыш:";
            recalculateMaxWin();
            
            trapsSelector.style.opacity = '1';
            betWrapper.style.opacity = '1';
            trapsSelector.style.pointerEvents = 'all';
            betWrapper.style.pointerEvents = 'all';
        }

        function get3DStarSvg() {
            return `
            <div class="star-container">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <defs>
                        <linearGradient id="starBody" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fffa80" />
                            <stop offset="30%" stop-color="#ffcc00" />
                            <stop offset="75%" stop-color="#ea580c" />
                            <stop offset="100%" stop-color="#9a3412" />
                        </linearGradient>

                        <radialGradient id="glassShine" cx="35%" cy="30%" r="55%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                            <stop offset="50%" stop-color="#ffcc00" stop-opacity="0.4" />
                            <stop offset="100%" stop-color="#c2410c" stop-opacity="0" />
                        </radialGradient>

                        <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
                            <stop offset="50%" stop-color="#ffdd66" stop-opacity="0.5" />
                            <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
                        </radialGradient>

                        <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.7" />
                        </filter>
                    </defs>

                    <path d="M 50 14 L 61 38 L 86 38 L 66 54 L 74 78 L 50 63 L 26 78 L 34 54 L 14 38 L 39 38 Z" 
                          fill="url(#starBody)" 
                          stroke="#d97706" 
                          stroke-width="1.5"
                          filter="url(#shadow3d)" />

                    <path d="M 50 14 L 61 38 L 86 38 L 66 54 L 74 78 L 50 63 L 26 78 L 34 54 L 14 38 L 39 38 Z" 
                          fill="url(#glassShine)" />

                    <path d="M 50 22 L 57 37 L 72 37 L 60 46 L 65 61 L 50 51 L 35 61 L 40 46 L 28 37 L 43 37 Z" 
                          fill="url(#innerGlow)" 
                          opacity="0.9" />
                </svg>
            </div>
            `;
        }

        function showWinModal(amountText) {
            document.getElementById('modal-win-amount').textContent = amountText;
            document.getElementById('win-modal').classList.add('modal-active');
            triggerConfetti();
        }

        function closeModal() {
            document.getElementById('win-modal').classList.remove('modal-active');
        }

        function triggerConfetti() {
            const container = document.getElementById('confetti-container');
            container.innerHTML = '';
            const colors = ['#10b981', '#38bdf8', '#fbbf24', '#f97316', '#0284c7'];
            
            for (let i = 0; i < 120; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-20px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '4px';
                
                const size = Math.random() * 8 + 6;
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';
                
                container.appendChild(confetti);
                
                confetti.style.animation = `confetti-fall 3.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards`;
                confetti.style.animationDelay = Math.random() * 3 + 's';
            }
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 6000);
        }
    </script>
</body>
</html>
